[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "svod"
version = "0.1.0"
description = "Declarative work pipelines for coding agents: steps, gates and a position computed from files and git"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.scripts]
svod = "svod.cli:main"

[tool.setuptools.packages.find]
include = ["svod*"]

[tool.setuptools.package-data]
svod = ["locale/*.yaml"]
