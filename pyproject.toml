[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "svod"
dynamic = ["version"]
description = "Declarative work pipelines for coding agents: steps, gates and a position computed from files and git"
urls = { Homepage = "https://github.com/MorinV/SVOD" }
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.scripts]
svod = "svod.cli:main"

[tool.setuptools.dynamic]
version = { attr = "svod.__version__" }

[tool.setuptools.packages.find]
include = ["svod*"]
exclude = ["svod.skills.svod-fret*"]

[tool.setuptools.package-data]
svod = ["locale/*.yaml", "skills/**/*", "templates/**/*", "templates/**/.gitignore"]

[tool.setuptools.exclude-package-data]
svod = ["skills/**/__pycache__/*", "skills/**/*.pyc"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]

[tool.coverage.run]
source = ["svod"]
