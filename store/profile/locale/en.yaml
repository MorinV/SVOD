doc:
  attr:
    hotfix: "for a hotfix (kind: hotfix)"
    planned: "for a planned task (kind is not hotfix)"
    to_work: "when outcome is hotfix or feature"
    to_knowledge: "when outcome is knowledge"
work:
  title:
    card: "Card"
    questions: "Questions"
    approve: "Approval"
    breakdown: "Breakdown"
    children: "Children done"
    checks: "Checks"
    deliver: "Delivery"
  mark:
    card: "card.md"
    services: "services named"
    questions: "questions.md"
    answered: "questions answered"
    breakdown: "breakdown.md"
    children: "child records exist"
    children_done: "child records done"
    checks: "checks.md"
    checks_pass: "checks pass"
    result: "result approved"
  step:
    questions: "write what you do not know into questions.md as ## Q: headings (or the single line none), ask the person in the chat and wait; record each answer with svod answer <record> --q <n> <text>"
  active:
    item: "- {id} - {step}"
task:
  title:
    contract: "Contract"
    hotfix_approve: "Hotfix approval"
    implement: "Implement"
  mark:
    cause: "cause named"
    contract: "contract.md"
    approved: "contract approved"
    worktrees: "worktrees (work.yaml)"
  step:
    card: "write work/tasks/<name>/card.md like work/tasks/example: frontmatter type: card, kind, services; description and acceptance"
    services: "name the services in card.md: services: [app], names from services of svod.yaml"
    cause: "a hotfix names its cause in card.md: cause: <incident or record>"
    contract: "write contract.md: result, boundaries per service, effects, checks, risks"
    approve: "show card.md, questions.md and contract.md to the person and wait for Approved in the chat; then svod approve work/tasks/<name> --step approve"
    approve_drift: "card.md, questions.md or contract.md changed after the approval: show the change, wait for a fresh Approved, then svod approve work/tasks/<name> --step approve"
    approve_legacy: "the approval has no approver or version: show the contract again, wait for Approved, then svod approve work/tasks/<name> --step approve"
    hotfix_approve: "a hotfix needs no approval; when the person approves anyway: svod approve work/tasks/<name> --step hotfix_approve"
    implement: "make a worktree per service with bash profile/actions/start-task.sh work/tasks/<name>, then implement there and commit with the task key"
    checks: "commit in every worktree, then run bash profile/actions/checks.sh work/tasks/<name>; on failure read checks.log, fix and run it again"
    deliver: "print the PR description with bash profile/actions/pr.sh work/tasks/<name>, open the PRs and show them to the person; after Approved: svod approve work/tasks/<name> --step deliver"
    deliver_drift: "checks.md changed after the result was approved: show the new result, wait for Approved, then svod approve work/tasks/<name> --step deliver"
    close: "after the merge set status: done in card.md, then remove clean worktrees with bash profile/actions/cleanup.sh work/tasks/<name>"
  done: "done: status is done in card.md; remove clean worktrees with bash profile/actions/cleanup.sh work/tasks/<name>"
  violation:
    implement_approve: "worktrees were made before the contract was approved"
  active:
    mine_active: "Tasks in progress:"
    mine_idle: "Tasks:"
    theirs: "Tasks of the team:"
    theirs_collapsed: "Tasks of the team: {count} ({who}) · expand: svod active --all"
    worktree: "Tasks changed in the checkout {dir}:"
feature:
  title:
    brief: "Brief"
    integration: "Integration"
  mark:
    brief: "brief.md"
    approved: "brief approved"
  step:
    card: "write work/features/<name>/card.md: frontmatter type: card, services, parent, tags"
    brief: "write brief.md: the problem, the users, what is in and out of scope, acceptance"
    breakdown: "split the feature into tasks: work/tasks/<name>/card.md with parent: work/features/<feature>, listed in breakdown.md"
    approve: "show brief.md, questions.md and breakdown.md to the person and wait for Approved in the chat; then svod approve work/features/<name> --step approve"
    approve_drift: "brief.md, questions.md or breakdown.md changed after the approval: show the change, wait for a fresh Approved, then svod approve work/features/<name> --step approve"
    approve_legacy: "the approval has no approver or version: show the brief again, wait for Approved, then svod approve work/features/<name> --step approve"
    children: "take every task of breakdown.md to done: svod status work/tasks/<name> for each"
    integration: "run the checks of every service on the merged work: bash profile/actions/checks.sh work/features/<name>"
    deliver: "show the person what the feature delivers against brief.md; after Approved: svod approve work/features/<name> --step deliver"
    deliver_drift: "checks.md changed after the result was approved: show it again, wait for Approved, then svod approve work/features/<name> --step deliver"
    close: "set status: done in card.md of the feature"
  done: "done: status is done in card.md of the feature"
  violation:
    integration_approve: "integration ran before the brief was approved"
  active:
    mine_idle: "Features:"
    theirs: "Features of the team:"
    theirs_collapsed: "Features of the team: {count} ({who}) · expand: svod active --all"
    worktree: "Features changed in the checkout {dir}:"
project:
  title:
    vision: "Vision"
    researches: "Research done"
    architecture: "Architecture"
  mark:
    vision: "vision.md"
    adr: "ADR (type: adr)"
    approved: "design approved"
  step:
    card: "write work/projects/<name>/card.md: frontmatter type: card, services, tags"
    vision: "write vision.md: the goal, who gains, the measure of success, the limits"
    researches: "answer every open question with a research: work/research/<name>/card.md with parent: work/projects/<project>; take each to done"
    architecture: "record each decision in adr/<nnn>-<slug>.md with frontmatter type: adr: context, decision, consequences"
    approve: "show vision.md, questions.md and adr/ to the person and wait for Approved in the chat; then svod approve work/projects/<name> --step approve"
    approve_drift: "vision.md, questions.md or an ADR changed after the approval: show the change, wait for a fresh Approved, then svod approve work/projects/<name> --step approve"
    approve_legacy: "the approval has no approver or version: show the design again, wait for Approved, then svod approve work/projects/<name> --step approve"
    breakdown: "split the project into features and tasks with parent: work/projects/<name>, listed in breakdown.md"
    children: "take every feature and task of breakdown.md to done: svod status <record> for each"
    deliver: "write the outcome of every child into breakdown.md, show it to the person; after Approved: svod approve work/projects/<name> --step deliver"
    deliver_drift: "breakdown.md changed after the result was approved: show it again, wait for Approved, then svod approve work/projects/<name> --step deliver"
    deliver_legacy: "the result approval has no approver or version: show breakdown.md again, wait for Approved, then svod approve work/projects/<name> --step deliver"
    close: "set status: done in card.md of the project"
  done: "done: status is done in card.md of the project"
  violation:
    breakdown_approve: "the project was split before the design was approved"
  active:
    mine_idle: "Projects:"
    theirs: "Projects of the team:"
    theirs_collapsed: "Projects of the team: {count} ({who}) · expand: svod active --all"
    worktree: "Projects changed in the checkout {dir}:"
research:
  title:
    question: "Question"
    findings: "Findings"
    outcome: "Outcome"
  mark:
    question: "question.md"
    findings: "findings.md"
    outcome: "outcome set"
    leads_to: "leads_to set"
    leads_to_exists: "leads_to exists"
    knowledge: "knowledge set"
    knowledge_exists: "knowledge document exists"
  step:
    card: "write work/research/<name>/card.md: frontmatter type: card, parent, tags"
    question: "write question.md: the question, why it matters, what answer would change the plan"
    findings: "write findings.md: sources, experiments and the answer, each claim with its source"
    outcome: "set outcome in card.md: hotfix, feature or knowledge"
    leads_to: "make the hotfix or feature the research leads to and name it in card.md: leads_to: work/<kind>/<name>"
    knowledge: "write the answer to knowledge/<topic>.md and name it in card.md: knowledge: knowledge/<topic>.md"
    close: "set status: done in card.md of the research"
  done: "done: status is done in card.md of the research"
  active:
    mine_idle: "Research:"
    theirs: "Research of the team:"
    theirs_collapsed: "Research of the team: {count} ({who}) · expand: svod active --all"
    worktree: "Research changed in the checkout {dir}:"
