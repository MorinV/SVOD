error:
  not_root: "Run from the store root: svod.yaml not found"
  load: "Store configuration failed to load:"
validate:
  ok: "Configuration is valid: {count} pipelines"
  failed: "Configuration errors: {count}"
status:
  header: "{id}"
  checkout: "In the checkout {dir}, not in the default branch yet"
  next_step: "Next step: {step}."
  do_not_touch: "Do not touch the code: step {step} has not passed."
  do_not_touch_blocked: "Do not touch the code: entry conditions are not met."
  unknown: "could not check: {reason}"
  skill: "Step skill: {skill}"
  skill_unassigned: "Step skill: not assigned (role {role})"
  skill_item: "{dir} -> {skill}"
  skill_none: "none"
  violations: "Order violations:"
  violation_item: "- {text}"
  violation: "step {later} passed while the required step {earlier} did not"
  not_found: "Nothing matches the query: {query}"
  ambiguous: "Several subjects match:"
  candidate: "{id}"
  mark:
    pass: "+ {label}"
    fail: "- {label}"
    unknown: "? {label}"
active:
  mine_active: "Your work in progress:"
  mine_idle: "Your work without progress:"
  theirs: "In progress for the team:"
  theirs_collapsed: "In progress for the team: {count} ({who}) · expand: svod active --all"
  author_count: "{author} - {count}"
  item: "- {id} ({keys}) - {step}"
  no_keys: "no key"
  hook_tail: "Position of any item: svod status <query>"
  no_local_config: "Local config {file} is missing: ask the person for a login, then svod init --login <login> --email <email>"
  no_identity: "Who you are is unknown: no email in the local config nor in git user.email, so all work below is shown as yours"
  worktree: "In progress in the checkout {dir}:"
init:
  written: "Local config written: {path}"
  exists: "Local config already exists: {path} (--force to overwrite)"
  not_configured: "svod.yaml names no {field} file"
  need_login: "Login is required: --login <login>"
  prompt_login: "Login: "
  prompt_email: "Email [{default}]: "
approve:
  done: "Approval recorded in {file}: {marker} {date}, by {by}, version {sha}. Nothing is committed."
  no_mark: "No fresh approval by a person in the chat: show the plan and wait for the answer"
  foreign_key: "The approval in the chat names {mark_keys}, not {keys}: ask to approve this one"
  no_gate: "Nothing to approve for {query}: its pipeline has no approval step"
  no_approver: "Who approves is unknown: create the local config with svod init"
doc:
  generated: "Generated from {source}: edit it there, then run {command}"
  entry: "entry"
  done: "done"
  done_text: "when passed: {text}"
  pending_text: "when every step passed and it did not: {text}"
  blocks_code: "code frozen until passed"
  legend:
    required: "Bold border: a required step."
    optional: "Dashed border: an optional step, only marked, never the position."
    frozen: "Red border: the code stays untouched until the step passes."
  head:
    step: "Step"
    gates: "Gates (what must hold)"
    role: "Role"
    next: "Next step when not passed"
  required: "required"
  optional: "optional"
  severity:
    block: "block"
    warn: "warning"
  when: "if {when} is set"
  no_gates: "no gate: the last mile outside the store, never passes"
  none: "-"
  placeholder: "..."
render:
  unknown: "Unknown pipeline: {name}"
  written: "Updated: {path}"
  current: "Up to date: {path}"
  no_markers: "No file holds the block markers of {name}: {marker}"
gate:
  exists: "the subject exists"
  artifact_path: "{path} exists"
  artifact_glob: "at least {min} of {glob}"
  approval: "{marker} is set in {file}"
  approval_bound: "{marker} in {file} names the approver and the version of {bind} as they are now"
  field_equals: "{name} is {value}"
  field_not_equals: "{name} is set and is not {value}"
  field_present: "{name} is filled in"
  field_absent: "{name} is empty"
  field_date_not_past: "{name} is a date not in the past"
  field_date_past: "{name} is a date in the past"
  doc_type: "a document of type {type}"
  doc_type_container: "the container holds a document of type {type}"
  archived: "archived"
  git_pushed: "the store has no commits ahead of origin"
  git_pushed_repo: "{repo} has no commits ahead of origin"
