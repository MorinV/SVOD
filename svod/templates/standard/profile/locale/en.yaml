doc:
  attr:
    hotfix: "for a hotfix (kind: hotfix)"
    planned: "for a planned task (kind is not hotfix)"
    to_work: "when outcome is task or research"
    to_knowledge: "when outcome is knowledge"
work:
  title:
    card: "Card"
    questions: "Questions"
    approve: "Approval"
    breakdown: "Breakdown"
    children: "Children done"
    checks: "Checks"
    deliver: "Delivery"
  mark:
    card: "card.md"
    services: "services named"
    questions: "questions.md"
    answered: "questions answered"
    breakdown: "plan.yaml"
    children: "child records exist"
    children_done: "child records done"
    checks: "checks.md"
    checks_pass: "checks pass"
    result: "result approved"
  step:
    questions: "add each thing you do not know with svod ask <record> \"<question>\" (or svod ask <record> --none when there is nothing to ask), ask the person in the chat and wait; record each answer with svod answer <record> --q <n> <text>"
    questions_missing: "ask your questions with svod ask <record> \"<question>\", or svod ask <record> --none when there is nothing to ask"
    questions_unanswered: "{count} questions without an answer: ask them in the chat, wait, and record each answer with svod answer <record> --q <n> <text>"
  active:
    item: "- {id} - {step}"
task:
  title:
    contract: "Contract"
    hotfix_approve: "Hotfix approval"
    implement: "Implement"
  mark:
    cause: "cause named"
    contract: "contract.md"
    approved: "contract approved"
    worktrees: "worktrees (work.yaml)"
  step:
    card: "write <record>/card.md like work/headless/tasks/example: frontmatter type: card, kind, services; description and acceptance"
    services: "name the services in card.md: services: [app], names from services of svod.yaml"
    cause: "a hotfix names its cause in card.md: cause: <incident or record>"
    contract: "write contract.md: result, boundaries per service, effects, checks, risks"
    approve: "show card.md, questions.md and contract.md to the person and wait for Approved in the chat; then svod approve <record> --step approve"
    approve_drift: "card.md, questions.md or contract.md changed after the approval: show the change, wait for a fresh Approved, then svod approve <record> --step approve"
    approve_legacy: "the approval has no approver or version: show the contract again, wait for Approved, then svod approve <record> --step approve"
    hotfix_approve: "a hotfix needs no approval; when the person approves anyway: svod approve <record> --step hotfix_approve"
    implement: "make a worktree per service with bash profile/actions/start-task.sh <record>, then implement there and commit with the task key"
    checks: "commit in every worktree, then run bash profile/actions/checks.sh <record>; on failure read checks.log, fix and run it again"
    deliver: "print the PR description with bash profile/actions/pr.sh <record>, open the PRs and show them to the person; after Approved: svod approve <record> --step deliver"
    deliver_drift: "checks.md changed after the result was approved: show the new result, wait for Approved, then svod approve <record> --step deliver"
    close: "after the merge set status: done in card.md, then remove clean worktrees with bash profile/actions/cleanup.sh <record>"
  done: "done: status is done in card.md; remove clean worktrees with bash profile/actions/cleanup.sh <record>"
  violation:
    implement_approve: "worktrees were made before the contract was approved"
  active:
    mine_active: "Tasks in progress:"
    mine_idle: "Tasks:"
    theirs: "Tasks of the team:"
    theirs_collapsed: "Tasks of the team: {count} ({who}) · expand: svod active --all"
    worktree: "Tasks changed in the checkout {dir}:"
feature:
  title:
    brief: "Brief"
    integration: "Integration"
  mark:
    brief: "brief.md"
    approved: "brief approved"
  step:
    card: "write <record>/card.md: frontmatter type: card, services, parent, tags"
    brief: "write brief.md: the problem, the users, what is in and out of scope, acceptance"
    breakdown: "define tasks/research and criteria in plan.yaml; place children at <record>/tasks/<name> or <record>/research/<name> with parent: <record> (also for a feature inside a project); svod plan validate <record>"
    approve: "show brief.md, questions.md and plan.yaml to the person and wait for Approved in the chat; then svod approve <record> --step approve"
    approve_drift: "brief.md, questions.md or plan.yaml changed after the approval: show the change, wait for a fresh Approved, then svod approve <record> --step approve"
    approve_legacy: "the approval has no approver or version: show the brief again, wait for Approved, then svod approve <record> --step approve"
    children: "take linked tasks to done; read svod plan summary <record>; verify criteria explicitly, never infer acceptance from done"
    integration: "run the checks of every service on the merged work: bash profile/actions/checks.sh <record>"
    deliver: "show primary outcome.yaml, acceptance.yaml and checks.md against brief.md; after Approved: svod approve <record> --step deliver"
    deliver_drift: "checks.md, outcome.yaml or acceptance.yaml changed after result approval: show changes, wait for Approved, then svod approve <record> --step deliver"
    close: "set status: done in card.md of the feature"
  done: "done: status is done in card.md of the feature"
  violation:
    integration_approve: "integration ran before the brief was approved"
  active:
    mine_idle: "Features:"
    theirs: "Features of the team:"
    theirs_collapsed: "Features of the team: {count} ({who}) · expand: svod active --all"
    worktree: "Features changed in the checkout {dir}:"
project:
  title:
    vision: "Vision"
    researches: "Research done"
    architecture: "Architecture"
  mark:
    vision: "vision.md"
    adr: "ADR (type: adr)"
    approved: "design approved"
  step:
    card: "write <record>/card.md: frontmatter type: card, services, tags"
    vision: "write vision.md: the goal, who gains, the measure of success, the limits"
    researches: "answer open questions with <record>/research/<name>/card.md and parent: <record>; take each to done"
    architecture: "record each decision in adr/<nnn>-<slug>.md with frontmatter type: adr: context, decision, consequences"
    approve: "show vision.md, questions.md and adr/ to the person and wait for Approved in the chat; then svod approve <record> --step approve"
    approve_drift: "vision.md, questions.md or an ADR changed after the approval: show the change, wait for a fresh Approved, then svod approve <record> --step approve"
    approve_legacy: "the approval has no approver or version: show the design again, wait for Approved, then svod approve <record> --step approve"
    breakdown: "define features/tasks/research and criteria in plan.yaml; create <record>/features/<name>, <record>/tasks/<name>, <record>/research/<name> with parent: <record>; feature children belong inside that feature; link canonical paths; svod plan validate <record>"
    children: "take linked features/tasks to done; svod plan summary <record> reads primary states/outcomes without copying"
    deliver: "write own outcome.yaml and explicitly verified acceptance.yaml; show primary results and svod plan summary <record>; after Approved: svod approve <record> --step deliver"
    deliver_drift: "outcome.yaml or acceptance.yaml changed after result approval: show changes, wait for Approved, then svod approve <record> --step deliver"
    deliver_legacy: "result approval lacks approver/version: show primary outcome/acceptance, wait for Approved, then svod approve <record> --step deliver"
    close: "set status: done in card.md of the project"
  done: "done: status is done in card.md of the project"
  violation:
    breakdown_approve: "the project was split before the design was approved"
  active:
    mine_idle: "Projects:"
    theirs: "Projects of the team:"
    theirs_collapsed: "Projects of the team: {count} ({who}) · expand: svod active --all"
    worktree: "Projects changed in the checkout {dir}:"
research:
  title:
    question: "Question"
    findings: "Findings"
    outcome: "Outcome"
  mark:
    question: "question.md"
    findings: "findings.md"
    outcome: "outcome set"
    leads_to: "leads_to set"
    leads_to_exists: "leads_to exists"
    knowledge: "knowledge set"
    knowledge_exists: "knowledge document exists"
  step:
    card: "write <record>/card.md: frontmatter type: card, parent, tags"
    question: "write question.md: the question, why it matters, what answer would change the plan"
    findings: "write findings.md: sources, experiments and the answer, each claim with its source"
    outcome: "set outcome in card.md: task, research or knowledge"
    leads_to: "create a task/research under its project/feature or work/headless; set leads_to: <successor-record>; provenance is not containment, never use research as parent"
    knowledge: "run svod knowledge publish <record>: show findings, obtain the next human go-ahead, then repeat to publish and close"
    close: "for outcome knowledge use svod knowledge publish <record>; otherwise set status: done only after human agreement"
  done: "done: status is done in card.md of the research"
  active:
    mine_idle: "Research:"
    theirs: "Research of the team:"
    theirs_collapsed: "Research of the team: {count} ({who}) · expand: svod active --all"
    worktree: "Research changed in the checkout {dir}:"
