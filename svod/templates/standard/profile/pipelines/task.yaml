pipeline: task
subject:
  provider: work
  key_gate: work_id
  params: { roots: [work/tasks], head_type: card }
active:
  in_progress: { gate: artifact, params: { path: work.yaml } }
  item: work.active.item
  headings:
    mine_active: task.active.mine_active
    mine_idle: task.active.mine_idle
    theirs: task.active.theirs
    theirs_collapsed: task.active.theirs_collapsed
    worktree: task.active.worktree
done: { gate: field, params: { name: status, equals: done }, text: task.done, pending: task.step.close }
steps:
  - id: card
    title: work.title.card
    role: task
    text: task.step.card
    gates:
      - { gate: artifact, params: { path: card.md }, label: work.mark.card }
      - { gate: field, params: { name: services, not_equals: "[]" }, label: work.mark.services, text: task.step.services }
      - { gate: field, params: { name: cause, present: true }, when: hotfix, label: task.mark.cause, text: task.step.cause }
  - id: questions
    title: work.title.questions
    role: questions
    text: work.step.questions
    gates:
      - { gate: artifact, params: { path: questions.md }, label: work.mark.questions }
      - { gate: questions_answered, params: { file: questions.md }, label: work.mark.answered }
  - id: contract
    title: task.title.contract
    role: task
    when: planned
    required: true
    text: task.step.contract
    gates:
      - { gate: artifact, params: { path: contract.md }, label: task.mark.contract }
  - id: approve
    title: work.title.approve
    role: task
    when: planned
    required: true
    blocks_code: true
    text: task.step.approve
    gates:
      - gate: approval
        purpose: contract
        label: task.mark.approved
        params:
          marker: contract_approved
          file: approval.yaml
          bind: [card.md, contract.md, questions.md]
          ignore: ["^status:"]
  - id: hotfix_approve
    title: task.title.hotfix_approve
    role: task
    when: hotfix
    optional: true
    text: task.step.hotfix_approve
    gates:
      - gate: approval
        purpose: contract
        label: task.mark.approved
        params:
          marker: contract_approved
          file: approval.yaml
          bind: [card.md, questions.md]
          ignore: ["^status:"]
  - id: implement
    title: task.title.implement
    role: task
    action: start-task
    text: task.step.implement
    gates:
      - { gate: artifact, params: { path: work.yaml }, label: task.mark.worktrees }
  - id: checks
    title: work.title.checks
    role: task
    required: true
    text: task.step.checks
    gates:
      - { gate: artifact, params: { path: checks.md }, label: work.mark.checks }
      # With services declared in svod.yaml, let a script decide instead of the file:
      # - { gate: command, params: { argv: [bash, profile/actions/checks.sh], service: app }, label: work.mark.checks_pass }
  - id: deliver
    title: work.title.deliver
    role: task
    optional: true
    text: task.step.deliver
    gates:
      - gate: approval
        purpose: result
        label: work.mark.result
        params:
          marker: result_approved
          file: approval.yaml
          bind: [checks.md]
violations:
  implement.approve: task.violation.implement_approve
