pipeline: research
subject:
  provider: work
  params: { roots: [work/research], head_type: card }
active:
  item: work.active.item
  headings:
    mine_idle: research.active.mine_idle
    theirs: research.active.theirs
    theirs_collapsed: research.active.theirs_collapsed
    worktree: research.active.worktree
done: { gate: field, params: { name: status, equals: done }, text: research.done, pending: research.step.close }
steps:
  - id: question
    title: research.title.question
    role: research
    text: research.step.question
    gates:
      - { gate: artifact, params: { path: card.md }, label: work.mark.card, text: research.step.card }
      - { gate: artifact, params: { path: question.md }, label: research.mark.question }
  - id: findings
    title: research.title.findings
    role: research
    required: true
    text: research.step.findings
    gates:
      - { gate: artifact, params: { path: findings.md }, label: research.mark.findings }
  - id: outcome
    title: research.title.outcome
    role: research
    required: true
    text: research.step.outcome
    gates:
      - { gate: field, params: { name: outcome, present: true }, label: research.mark.outcome }
      - { gate: field, params: { name: leads_to, present: true }, when: to_work, label: research.mark.leads_to, text: research.step.leads_to }
      - { gate: ref_exists, params: { field: leads_to, pipelines: [task, feature] }, when: to_work, label: research.mark.leads_to_exists, text: research.step.leads_to }
      - { gate: field, params: { name: knowledge, present: true }, when: to_knowledge, label: research.mark.knowledge, text: research.step.knowledge }
