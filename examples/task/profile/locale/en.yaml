task:
  header: "{id} ({keys})"
  title:
    propose: "Propose"
    spec: "Specify"
    approve: "Approve the plan"
    workspace: "Work directory"
    implement: "Implement"
    merge: "Merge"
  mark:
    proposal: "proposal"
    design: "design"
    spec: "spec"
    tasks: "tasks"
    approved: "plan approved"
    worktree: "work directory"
    merged: "merged"
  step:
    propose: "create the change openspec/changes/<name> with the task key in .openspec.yaml"
    proposal: "write proposal.md of the change: why and what changes"
    design: "write design.md of the change: how it is built"
    spec: "write the requirements in specs/<capability>/spec.md of the change"
    tasks: "write tasks.md of the change: the steps of the work"
    approve: "show the plan to the person and wait for the approval in the chat; then svod approve <key>"
    approve_missing: "show the plan (proposal, design, specs, tasks) to the person and wait for the approval in the chat; then svod approve <key>"
    approve_legacy: "the approval has no approver or version: show the plan again and record a fresh approval with svod approve <key>"
    approve_drift: "the plan changed after the approval: show what changed and record a fresh approval with svod approve <key>"
    workspace: "make the work directory next to the store: git worktree add ../<repo>-<KEY>_<slug> -b <KEY>_<slug>"
    implement: "implement the tasks in the work directory and commit with the task key in the message"
    merge: "open a pull request and get it merged into the default branch"
    merge_open: "the work directories {open} are not merged yet: get the pull request merged and fetch"
    merge_no_commit: "the default branch has no commit naming the task yet: get the pull request merged and fetch"
    merge_no_repos: "no repository knows the task: make the work directory and commit there"
    archive: "archive the change: move it to openspec/changes/archive"
  done: "nothing left, the change is archived"
  violation:
    implement_approve: "code was committed before the plan was approved"
worktree:
  display: "work directories: {worktrees}"
  none: "no work directory"
  removed: "work directory removed after the merge"
  item: "{name} (+{ahead})"
  item_foreign: "{name} (+{ahead} of {ahead_all})"
  item_unknown: "{name} (?)"
merged:
  display: "merged in: {repos}; not merged: {open}"
  none: "-"
gate:
  key: "the subject carries a task key"
  worktree: "a work directory whose name and branch name the task key"
  worktree_ahead: "a work directory with at least {min_ahead} own commits"
  worktree_or_merged: "{text}, or the work is merged"
  merged: "the work directories are merged or removed, and the default branch has a task commit"
