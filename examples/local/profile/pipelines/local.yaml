pipeline: local
subject:
  provider: container
  params:
    roots: [tasks]
done:
  gate: current_process
  params: {phase: complete}
  text: local.done
steps:
  - id: contract
    text: local.contract
    required: true
    gates:
      - gate: current_process
        params: {phase: contract}
  - id: initial_approve
    text: local.approve
    required: true
    blocks_code: true
    gates:
      - gate: approval
        purpose: contract
        params:
          marker: approved
          file: approval.yaml
          bind: [contract.md, testing/plan.yaml]
  - id: result
    text: local.result
    required: true
    gates:
      - gate: current_process
        params: {phase: result}
